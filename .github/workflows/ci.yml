name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-interfaces:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile shared header
        run: |
          printf '#include "interfaces.h"\nint main() { return 0; }\n' > /tmp/check_interfaces.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -fsyntax-only -Iinclude /tmp/check_interfaces.cpp
